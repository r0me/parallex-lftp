<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallex LFTP</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>PARALLEX<span class="brand-sub">LFTP</span></h1>
    </div>
    <div class="conn-strip">
      <span id="conn-led" class="led"></span>
      <span id="conn-label" class="conn-label">NOT CONNECTED</span>
    </div>
    <div class="toolbar-actions">
      <button id="btn-upload" class="btn accent" disabled title="Upload selected local file or folder">&#8593; UPLOAD</button>
      <button id="btn-download" class="btn accent" disabled title="Download selected remote file or folder">&#8595; DOWNLOAD</button>
      <span class="toolbar-sep"></span>
      <button id="btn-sites" class="btn">SITE MANAGER</button>
      <button id="btn-settings" class="btn">SETTINGS</button>
      <button id="btn-disconnect" class="btn danger" disabled>DISCONNECT</button>
      <button id="btn-logout" class="btn" hidden>LOG OUT</button>
    </div>
  </header>

  <main class="panes">
    <!-- LOCAL PANE -->
    <section class="pane" id="pane-local">
      <div class="pane-head">
        <span class="pane-title">LOCAL <span class="pane-hint">/data</span></span>
        <div class="pane-tools">
          <button class="btn sm" data-act="local-refresh" title="Refresh">&#8635;</button>
          <button class="btn sm" data-act="local-mkdir" title="New folder">+DIR</button>
          <button class="btn sm" data-act="local-rename" title="Rename selection">REN</button>
          <button class="btn sm danger" data-act="local-delete" title="Delete selection">DEL</button>
        </div>
      </div>
      <nav class="breadcrumb" id="local-breadcrumb"></nav>
      <div class="filelist-wrap">
        <table class="filelist">
          <thead><tr><th>Name</th><th class="col-size">Size</th><th class="col-date">Modified</th></tr></thead>
          <tbody id="local-list"></tbody>
        </table>
        <div class="pane-empty" id="local-empty" hidden>empty directory</div>
      </div>
    </section>

    <!-- REMOTE PANE -->
    <section class="pane" id="pane-remote">
      <div class="pane-head">
        <span class="pane-title">REMOTE <span class="pane-hint" id="remote-hint">no session</span></span>
        <div class="pane-tools">
          <button class="btn sm" data-act="remote-refresh" title="Refresh" disabled>&#8635;</button>
          <button class="btn sm" data-act="remote-mkdir" title="New folder" disabled>+DIR</button>
          <button class="btn sm" data-act="remote-rename" title="Rename selection" disabled>REN</button>
          <button class="btn sm danger" data-act="remote-delete" title="Delete selection" disabled>DEL</button>
        </div>
      </div>
      <nav class="breadcrumb" id="remote-breadcrumb"></nav>
      <div class="filelist-wrap">
        <table class="filelist">
          <thead><tr><th>Name</th><th class="col-size">Size</th><th class="col-date">Modified</th></tr></thead>
          <tbody id="remote-list"></tbody>
        </table>
        <div class="pane-empty" id="remote-empty" hidden>not connected</div>
      </div>
    </section>
  </main>

  <!-- TRANSFER QUEUE -->
  <section class="queue">
    <div class="queue-head">
      <span class="pane-title">TRANSFER QUEUE</span>
      <button id="btn-clear-finished" class="btn sm">CLEAR FINISHED</button>
    </div>
    <div id="queue-list" class="queue-list"></div>
  </section>

  <footer class="statusbar"><span id="status-text">ready</span></footer>

  <!-- SITE MANAGER MODAL -->
  <div class="modal-backdrop" id="modal-sites" hidden>
    <div class="modal wide">
      <div class="modal-head"><span>SITE MANAGER</span><button class="btn sm" data-close="modal-sites">&#10005;</button></div>
      <div class="modal-body split">
        <aside class="site-list-col">
          <ul id="site-list" class="site-list"></ul>
          <button id="btn-new-site" class="btn full">+ NEW SITE</button>
        </aside>
        <form id="site-form" class="site-form" autocomplete="off">
          <input type="hidden" id="sf-id">
          <label>Name<input id="sf-name" required placeholder="My Server"></label>
          <div class="row">
            <label class="grow">Host<input id="sf-host" required placeholder="example.com"></label>
            <label class="w-port">Port<input id="sf-port" type="number" placeholder="auto"></label>
            <label class="w-proto">Protocol
              <select id="sf-protocol">
                <option value="ftp">FTP</option>
                <option value="ftps">FTPS</option>
                <option value="sftp">SFTP</option>
                <option value="https">HTTPS</option>
                <option value="http">HTTP</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label class="grow">Username<input id="sf-username" placeholder="anonymous"></label>
            <label class="grow">Password<input id="sf-password" type="password" placeholder="(unchanged)"></label>
          </div>
          <label>Auth
            <select id="sf-authType">
              <option value="password">Password</option>
              <option value="key" disabled>SSH key (not wired up yet)</option>
            </select>
          </label>
          <div class="row">
            <label class="grow">Remote dir<input id="sf-remoteDir" placeholder="/"></label>
            <label class="grow">Local dir<input id="sf-localDir" placeholder="/"></label>
          </div>
          <div class="row">
            <label class="grow">Threads override<input id="sf-threads" type="number" min="1" max="16" placeholder="global"></label>
            <label class="grow">Segments override<input id="sf-segments" type="number" min="1" max="20" placeholder="global"></label>
          </div>
          <label class="row-inline"><input id="sf-verifyTls" type="checkbox" checked> Verify TLS certificate (uncheck for self-signed HTTPS/FTPS)</label>
          <div class="modal-actions">
            <button type="submit" class="btn accent">SAVE</button>
            <button type="button" id="btn-site-connect" class="btn accent" hidden>CONNECT</button>
            <button type="button" id="btn-site-delete" class="btn danger" hidden>DELETE</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop" id="modal-settings" hidden>
    <div class="modal">
      <div class="modal-head"><span>TRANSFER SETTINGS</span><button class="btn sm" data-close="modal-settings">&#10005;</button></div>
      <form id="settings-form" class="modal-body site-form">
        <label>Theme
          <select id="st-theme">
            <option value="amber">Rack Amber (default)</option>
            <option value="green">Retro Green</option>
            <option value="blue">Deep Blue</option>
          </select>
        </label>
        <label>Concurrent transfers (threads)<input id="st-threads" type="number" min="1" max="16"></label>
        <label>Segments per file (pget -n, downloads only)<input id="st-segments" type="number" min="1" max="20"></label>
        <label>Min file size to segment (MB)<input id="st-segmentMin" type="number" min="0" step="0.5"></label>
        <label>Bandwidth cap (KB/s, 0 = unlimited)<input id="st-bandwidth" type="number" min="0"></label>
        <div class="modal-actions"><button type="submit" class="btn accent">SAVE</button></div>
      </form>
    </div>
  </div>

  <!-- AUTH OVERLAY (first-run setup or sign-in) -->
  <div class="modal-backdrop auth-overlay" id="auth-overlay" hidden>
    <div class="modal">
      <div class="modal-head"><span id="auth-title">SIGN IN</span></div>
      <form id="auth-form" class="modal-body site-form">
        <p id="auth-hint" class="auth-hint"></p>
        <label>Username<input id="auth-username" autocomplete="username" required></label>
        <label>Password<input id="auth-password" type="password" autocomplete="current-password" required></label>
        <p id="auth-error" class="auth-error" hidden></p>
        <div class="modal-actions"><button type="submit" class="btn accent" id="auth-submit">SIGN IN</button></div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
