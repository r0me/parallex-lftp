services:
  parallex-lftp:
    build: .
    container_name: parallex-lftp
    ports:
      - "7609:7609"
    environment:
      # run as this uid:gid so downloads are editable on the host
      # (find yours with `id -u` / `id -g`; override here or in a .env file)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-022}
      # optional: credential-encryption secret. If set (e.g. in a .env
      # file), site passwords are encrypted with a key derived from it and
      # the key never touches the ./config volume. If unset, a random
      # keyfile at ./config/.secret is used instead.
      - PARALLEX_SECRET=${PARALLEX_SECRET:-}
      # optional: seed the single web-UI user at first boot (values are
      # hashed into config/auth.json, never stored as-is). Leave unset to
      # create the account through the first-run setup screen instead.
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      # what the LOCAL pane browses
      - ./data:/data
      # sites.json, settings.json, and the SSH known_hosts store persist here
      - ./config:/config
    restart: unless-stopped
